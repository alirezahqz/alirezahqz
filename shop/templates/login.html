{% extends "base.html" %}
{% block content %}
<style>
    @keyframes fadeIn {
        from {
            opacity: 0;
            transform: translateY(-20px);
        }
        to {
            opacity: 1;
            transform: translateY(0);
        }
    }
    
    .animated-header {
        animation: fadeIn 1s ease-in-out;
    }
</style>

<header class="bg-dark py-5 shadow-lg animated-header">
    <div class="container px-4 px-lg-5 my-5">
        <div class="text-center text-white">
            <h1 class="display-3 fw-bold text-warning">فروشگاه من</h1>
            <p class="lead fw-semibold text-light mb-0">🔥 این جا حراجیه! 🔥</p>
        </div>
    </div>
</header>

</b></br>

<div class="container animated-form">
    <div class="row justify-content-center">
        <div class="col-10">
            <form method="POST" action="{% url 'login' %}" class="p-4 border rounded-3 shadow-lg bg-light">
                {% csrf_token %}
                <h2 class="text-center text-primary fw-bold mb-4">ورود به حساب کاربری</h2>
                <div class="mb-3">
                    <input type="text" class="form-control rounded-pill shadow-sm" name="username" placeholder="نام کاربری را وارد کنید">
                </div>
                <div class="mb-3">
                    <input type="password" class="form-control rounded-pill shadow-sm" name="password" placeholder="رمز خود را وارد کنید">
                </div>
                <div class="text-center">
                    <button type="submit" class="btn btn-success rounded-pill px-4 py-2 fw-bold shadow-sm">🔑ورود</button>
                </div>
            </form>
        </div>
    </div>
</div>

{% endblock %}
